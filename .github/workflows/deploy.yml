name: Compilar C y publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar C a WebAssembly
        run: |
          mkdir -p dist
          cp web/* dist/
          docker run --rm -v "$PWD:/src" -u $(id -u):$(id -g) emscripten/emsdk \
            emcc src/dni.c -o dist/validador.js \
            -sEXPORTED_FUNCTIONS=_validar \
            -sEXPORTED_RUNTIME_METHODS=cwrap \
            -sMODULARIZE=1 \
            -sEXPORT_NAME=createModule

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
